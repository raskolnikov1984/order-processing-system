services:
  order-db:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_ORDER_DB}
  order-service:
    build: ./order-service
    ports:
      - "${ORDER_API_PORT:-8010}:8010"
    volumes:
      - ./order-service:/app
    depends_on:
      - order-db
    env_file:
      - .env
volumes:
  order-service:
